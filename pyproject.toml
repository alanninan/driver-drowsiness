[project]
name = "driver-drowsiness"
version = "0.1.0"
description = "Personalised webcam fatigue monitoring and subject-independent evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mediapipe>=0.10.21,<0.11",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
gpu = ["torch>=2.7,<2.11"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
drowsiness = "drowsiness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drowsiness"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

